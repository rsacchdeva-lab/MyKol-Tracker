name: Build My KOL Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyKOLTrackerAndroid-project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q MyKOLTrackerAndroid-project.zip

      - name: Build APK
        working-directory: MyKOLTrackerAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: My-KOL-Tracker-APK
          path: MyKOLTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
